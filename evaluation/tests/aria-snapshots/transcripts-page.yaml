- main:
  - heading "Annotated transcripts" [level=1]:
    - link "Annotated transcripts":
      - /url: "#annotated-transcripts"
    - text: Annotated transcripts
  - paragraph:
    - strong: All six transcripts are fictional and constructed for training purposes.
    - text: They are not recordings of real children; tutor and student names are invented. They are built from documented middle-school algebra misconceptions so that the errors students make in them are the errors real tutors will meet — the misconception research behind that choice is cited in the
    - link "evidence notes":
      - /url: https://github.com/iwyusdaz/tutor-training-course/blob/main/research/evidence-notes.md
    - text: . A structured realism review (agent-based; practitioner review pending) checked each transcript against that research — see
    - link "evaluation methods":
      - /url: https://github.com/iwyusdaz/tutor-training-course/blob/main/evaluation/METHODS.md
    - text: .
  - heading "Why transcripts instead of videos" [level=2]:
    - link "Why transcripts instead of videos":
      - /url: "#why-transcripts-instead-of-videos"
    - text: Why transcripts instead of videos
  - paragraph:
    - text: Videos of real sessions would show real children — a privacy problem, and a consent problem minors can’t meaningfully opt out of. Written fictional transcripts are private by construction, searchable, annotatable, and screen-reader accessible. They are also
    - emphasis: editable
    - text: ": trainers can adapt a transcript to their local curriculum without re-filming."
  - heading "The annotation format" [level=2]:
    - link "The annotation format":
      - /url: "#the-annotation-format"
    - text: The annotation format
  - paragraph:
    - text: Each transcript is a dialogue between the tutor and 2–4 students, broken into exchanges.
    - strong: Numbered annotations follow each exchange
    - text: — never floating in a margin — and name the move the tutor used (e.g.,
    - emphasis: probing question
    - text: ","
    - emphasis: wait time
    - text: ","
    - emphasis: confirm and ask why
    - text: ), which
    - link "competency domain":
      - /url: https://github.com/iwyusdaz/tutor-training-course/blob/main/research/competency-model.md
    - text: it serves, and what an observer would look for. Move names and hint-ladder levels (0–5) are shared with the companion
    - link "Socratic AI Tutor":
      - /url: https://iwyusdaz.github.io/socratic-ai-tutor/
    - text: project — same moves, encoded for an AI.
