  - paragraph:
    - strong: "Suggested sequence for new tutors:"
    - text: T1 → T5 → T2 → T6 → then
    - link "spot-the-move practice":
      - /url: /tutor-training-course/transcripts/practice/index.html
    - text: ", then T3 + T4 when your first observation is scheduled (they show why the rubric scores domains separately)."
